    <!-- Google Analytics 4: initialized inline. gtag.js (~185 KB) only loads

         someone stays fully idle. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P4BXD4JTQF');
      var __gtagLoaded = false;
      function loadGtag() {
        if (__gtagLoaded) return;
        __gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-P4BXD4JTQF';
        document.head.appendChild(s);
      }
      ['pointerdown', 'touchstart', 'scroll', 'keydown', 'mousemove'].forEach(function (evt) {
        addEventListener(evt, loadGtag, { once: true, passive: true });
      });
      setTimeout(loadGtag, 20000);
    </script>
